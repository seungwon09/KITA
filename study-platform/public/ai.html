<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KITA AI 학습</title>
<link rel="stylesheet" href="/kita.css">
<script src="/kita-runtime-config.js"></script>
<script src="/kita-api.js"></script>
</head>
<body>
<header class="topbar"><button class="brand" onclick="location.href='/'">KITA</button><div class="nav-actions"></div></header>
<main class="shell">
    <section class="hero">
        <div class="panel">
            <div class="badge"><span class="dot"></span> 통합 AI</div>
            <h1>질문하면<br>KITA가 짧고 정확하게</h1>
            <p class="muted">일반 질문, 문제 풀이, 그래프, 도형, 사진 인식을 한 화면에서 처리합니다.</p>
            <div class="toolbar" id="modeTabs">
                <button id="tab-chat" class="btn primary" onclick="setMode('chat')">AI 질문</button>
                <button id="tab-solve" class="btn ghost" onclick="setMode('solve')">문제 풀이</button>
                <button id="tab-graph" class="btn ghost" onclick="setMode('graph')">그래프</button>
                <button id="tab-geometry" class="btn ghost" onclick="setMode('geometry')">도형</button>
                <button id="tab-image" class="btn ghost" onclick="setMode('image')">사진</button>
            </div>
            <div class="field"><label id="promptLabel" for="prompt">AI에게 물어보기</label><textarea id="prompt" placeholder="질문이나 문제를 입력하세요."></textarea></div>
            <div class="row">
                <div class="field"><label for="subject">과목</label><select id="subject"><option value="auto">자동</option><option value="math">수학</option><option value="science">과학</option><option value="mixed">수학·과학</option></select></div>
                <div class="field"><label for="elapsed">풀이 시간</label><input id="elapsed" type="number" value="90" min="0"></div>
            </div>
            <div id="imageBox" class="field" hidden><label for="image">문제 또는 그래프 사진</label><input id="image" type="file" accept="image/*"></div>
            <button class="btn primary" onclick="runMode()">실행</button>
        </div>
        <div class="panel" id="adminStatusPanel" hidden>
            <h2>상태</h2>
            <div id="status" class="result"><span class="pill">확인 중</span></div>
        </div>
    </section>
    <section class="panel admin-gap"><h2>답변</h2><div id="answer" class="result"><div class="bubble">질문을 입력하고 실행을 눌러 주세요.</div></div></section>
</main>
<script src="/kita-nav.js"></script>
<script>
let mode = 'chat';
const history = [];
const esc = value => String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
function headers(json = true) { return { ...(json ? { 'Content-Type': 'application/json' } : {}), ...window.kitaAuthHeaders() }; }
function setMode(next) {
    mode = next;
    ['chat', 'solve', 'graph', 'geometry', 'image'].forEach(name => document.getElementById(`tab-${name}`).className = `btn ${name === mode ? 'primary' : 'ghost'}`);
    document.getElementById('imageBox').hidden = mode !== 'image';
    document.getElementById('promptLabel').textContent = { chat: 'AI에게 물어보기', solve: '문제 입력', graph: '그래프 식 또는 설명', geometry: '도형 문제 또는 설명', image: '사진에 대한 설명' }[mode];
}
function card(title, body) {
    if (!body && body !== 0) return '';
    const content = Array.isArray(body) ? `<ul>${body.map(item => `<li class="math">${window.kitaFormatMath(item)}</li>`).join('')}</ul>` : `<p class="math">${window.kitaFormatMath(body)}</p>`;
    return `<div class="card"><h3>${esc(title)}</h3>${content}</div>`;
}
async function api(path, body) {
    const res = await fetch(path, { method: 'POST', headers: headers(), body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || data.msg || '요청에 실패했습니다.');
    return data;
}
async function runMode() {
    const text = document.getElementById('prompt').value.trim();
    const subject = document.getElementById('subject').value;
    const elapsed = Number(document.getElementById('elapsed').value || 0);
    const answer = document.getElementById('answer');
    if (!text && mode !== 'image') return answer.innerHTML = '<div class="notice">질문이나 문제를 입력해 주세요.</div>';
    answer.innerHTML = '<div class="bubble">생각 중...</div>';
    try {
        if (mode === 'chat') {
            history.push({ role: 'user', content: text });
            const data = await api('/api/ai/chat', { message: text, subject, history });
            history.push({ role: 'assistant', content: data.reply });
            answer.innerHTML = `<div class="bubble user math">${window.kitaFormatMath(text)}</div><div class="bubble math">${window.kitaFormatMath(data.reply)}</div><span class="pill ok">${esc(data.provider)}</span>`;
            if (data.apiWarning) answer.insertAdjacentHTML('afterbegin', `<div class="notice">외부 API가 일시적으로 막혀 로컬 답변으로 전환됐습니다. 결제/크레딧 설정을 확인해 주세요.</div>`);
        } else if (mode === 'solve') {
            const data = await api('/api/ai/solve', { question: text, subject, solveTime: elapsed });
            answer.innerHTML = `<div class="toolbar">${data.verifiedAnswer ? `<span class="pill ok">정답 ${esc(data.verifiedAnswer)}</span>` : ''}<span class="pill">${esc(data.access?.planName || '')}</span></div><div class="grid two">${card('빠른 풀이', data.shortcut || data.fastSolution)}${card('기본 풀이', data.basicSolution || data.solution)}${data.eliteLocked ? card('상위권 풀이', '상급 풀이 요금제부터 사용할 수 있습니다.') : card('상위권 풀이', data.eliteSolution)}${card('주의할 실수', data.traps || [])}</div>`;
            if (data.apiWarning) answer.insertAdjacentHTML('afterbegin', `<div class="notice">외부 API가 일시적으로 막혀 기존 KITA 엔진으로 풀이했습니다. 결제/크레딧 설정을 확인해 주세요.</div>`);
        } else if (mode === 'graph') {
            const data = await api('/api/ai/graph', { graph_text: text, subject });
            answer.innerHTML = `<div class="grid two">${card('결론', data.conclusion)}${card('핵심 지점', data.keyFeatures || [])}${card('풀이 순서', data.solutionSteps || [])}${card('주의점', data.warnings || [])}</div>`;
        } else if (mode === 'geometry') {
            const data = await api('/api/ai/geometry', { geometry_text: text, subject });
            answer.innerHTML = `<div class="grid two">${card('결론', data.conclusion)}${card('공식', data.formulas || [])}${card('계산 순서', data.steps || [])}${card('주의점', data.mistakes || [])}</div>`;
        } else {
            const file = document.getElementById('image').files[0];
            if (!file) throw new Error('사진을 먼저 선택해 주세요.');
            const form = new FormData();
            form.append('image', file);
            form.append('graph_text', text);
            form.append('subject', subject);
            const res = await fetch('/api/ai/graph-image', { method: 'POST', headers: headers(false), body: form });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || '사진 분석에 실패했습니다.');
            answer.innerHTML = `<div class="grid two">${card('OCR 결과', data.ocr?.normalized_text || data.ocr?.extracted_text || '')}${card('결론', data.conclusion)}${card('그래프 분석', data.graph?.keyFeatures || [])}${card('도형 분석', data.geometry?.formulas || [])}</div>`;
        }
    } catch (err) {
        answer.innerHTML = `<div class="notice">${esc(err.message)}</div>`;
    }
}
function applyHashMode() {
    const hashMode = location.hash.replace('#', '');
    if (['chat', 'solve', 'graph', 'geometry', 'image'].includes(hashMode)) setMode(hashMode);
}
applyHashMode();
window.addEventListener('hashchange', applyHashMode);
if (sessionStorage.getItem('adminPin')) {
    document.getElementById('adminStatusPanel').hidden = false;
    fetch('/api/ai/status').then(res => res.json()).then(data => {
        document.getElementById('status').innerHTML = `<span class="pill ok">웹 정상</span><span class="pill ${data.studyAi?.ok ? 'ok' : 'bad'}">Study AI ${data.studyAi?.ok ? '정상' : '확인 필요'}</span><span class="pill">${data.featureCount || 30}개 기능</span>`;
    }).catch(() => document.getElementById('status').innerHTML = '<span class="pill bad">서버 확인 필요</span>');
}
</script>
</body>
</html>
