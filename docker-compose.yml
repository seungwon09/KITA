services:
  kita-web:
    build:
      context: ./study-platform
    container_name: kita-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      TRUST_PROXY: "false"
      STRICT_PRODUCTION_SECURITY: "false"
      ALLOW_DEV_PAYMENTS: "false"
      ENFORCE_HTTPS: "false"
      PORT: 3000
      STUDY_AI_BASE_URL: http://kita-ai:8002
      LOCAL_LLM_URL: http://host.docker.internal:11434/api/generate
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:3b}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/kita}
      CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - kita_web_data:/app/data
      - kita_uploads:/app/uploads
    depends_on:
      - kita-ai
      - mongo

  kita-ai:
    build:
      context: ./study-ai
    container_name: kita-ai
    restart: unless-stopped
    environment:
      USE_MOCK_LLM: "false"
      LOCAL_LLM_URL: http://host.docker.internal:11434/api/generate
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:3b}
      CORS_ORIGINS: "*"
      STUDY_AI_DB_PATH: /data/study_ai.sqlite3
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - kita_ai_db:/data
  mongo:
    image: mongo:7
    container_name: kita-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  kita_web_data:
  kita_uploads:
  kita_ai_db:
  mongo_data:
