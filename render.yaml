services:
  - type: web
    name: kita-api
    runtime: docker
    rootDir: study-platform
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/live
    disk:
      name: kita-api-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: STRICT_PRODUCTION_SECURITY
        value: "true"
      - key: ENFORCE_HTTPS
        value: "true"
      - key: ALLOW_DEV_PAYMENTS
        value: "false"
      - key: PUBLIC_BASE_URL
        value: https://kita-api-czgp.onrender.com
      - key: CORS_ORIGINS
        value: https://kita-ec927.web.app,https://kita-ec927.firebaseapp.com
      - key: STUDY_AI_BASE_URL
        value: https://kita-study-ai.onrender.com
      - key: AI_API_PROVIDER
        value: openai-compatible
      - key: AI_API_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_API_MODEL
        value: gpt-4.1-mini
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PIN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: kita-ec927
      - key: FIREBASE_WEB_API_KEY
        value: AIzaSyADG55eQj6Y7du4K-zWjseA-Za7ZSMKr1Q
      - key: FIREBASE_AUTH_DOMAIN
        value: kita-ec927.firebaseapp.com
      - key: FIREBASE_APP_ID
        value: 1:1041498599881:web:ed6d462437844d20427818
      - key: FIREBASE_MESSAGING_SENDER_ID
        value: "1041498599881"
      - key: FIREBASE_STORAGE_BUCKET
        value: kita-ec927.firebasestorage.app
      - key: FIREBASE_MEASUREMENT_ID
        value: G-X5XK5FJV2D
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

  - type: web
    name: kita-study-ai
    runtime: docker
    rootDir: study-ai
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    disk:
      name: kita-study-ai-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: USE_MOCK_LLM
        value: "true"
      - key: LOCAL_LLM_MODEL
        value: kita-study-ai
      - key: STUDY_AI_DB_PATH
        value: /data/study_ai.sqlite3
      - key: CORS_ORIGINS
        value: "*"
